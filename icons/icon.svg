<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#001a3d" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- the CloudPage: a web page with a cloud in its body -->
  <g filter="url(#sh)"><rect x="16" y="16" width="76" height="86" rx="9" fill="#fff"/></g>
  <path d="M25 16h58a9 9 0 0 1 9 9v7H16v-7a9 9 0 0 1 9-9z" fill="#DBEAFE"/>
  <circle cx="26" cy="24" r="2.6" fill="#2563EB"/><circle cx="34" cy="24" r="2.6" fill="#2563EB"/><circle cx="42" cy="24" r="2.6" fill="#2563EB"/>
  <!-- generic cloud glyph, deliberately not the Salesforce logo shape -->
  <path d="M36 62a9 9 0 0 1 1.5-17.9A13 13 0 0 1 62 47a8 8 0 0 1 1 15z" fill="#2563EB"/>
  <rect x="26" y="72" width="44" height="5" rx="2.5" fill="#BFDBFE"/>
  <rect x="26" y="83" width="32" height="5" rx="2.5" fill="#BFDBFE"/>

  <!-- the finder: handle starts at the ring edge so the lens reads as glass, not a donut -->
  <g filter="url(#sh)">
    <path d="M96.3 96.3 L112 112" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
    <path d="M96.3 96.3 L112 112" stroke="url(#ac)" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="83" cy="83" r="16" fill="#fff" stroke="#fff" stroke-width="14.5"/>
    <circle cx="83" cy="83" r="16" fill="#fff" stroke="url(#ac)" stroke-width="7.5"/>
    <path d="M76 81 a9 9 0 0 1 7 -7" fill="none" stroke="url(#ac)" stroke-width="3.6" stroke-linecap="round" opacity=".95"/>
  </g>
</svg>